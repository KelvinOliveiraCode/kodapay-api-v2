spring.application.name=kodapay-api-v2

# Produção: PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/kodapay
spring.datasource.username=kodapay
spring.datasource.password=kodapay
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Stripe (configurar em produção)
kodapay.stripe.secret-key=
kodapay.stripe.webhook-secret=

server.port=8080
